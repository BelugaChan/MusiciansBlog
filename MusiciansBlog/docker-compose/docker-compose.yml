  grafana:
    restart: always
    image: grafana/grafana:10.1.6
    ports:
      - 3000:3000
    volumes:
      - grafana-data:/var/lib/grafana
  postgres:
    container_name: mus_db
    image: postgres:latest
    volumes: 
      - ../postgres-data:/var/lib/postgresql/data    
    environment:
      POSTGRES_DB: musdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d musdb"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - musNet
    restart: unless-stopped
  
